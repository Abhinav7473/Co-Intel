<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A context window as a grid of token cells: memory (blue) and one tool (orange) in use, the rest free for the task. -->
  <rect width="32" height="32" rx="8" fill="#16181d"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="1">
    <rect x="5.5" y="13.5" width="5" height="5" rx="1.25"/>
    <rect x="13.5" y="13.5" width="5" height="5" rx="1.25"/>
    <rect x="21.5" y="13.5" width="5" height="5" rx="1.25"/>
    <rect x="5.5" y="21.5" width="5" height="5" rx="1.25"/>
    <rect x="13.5" y="21.5" width="5" height="5" rx="1.25"/>
    <rect x="21.5" y="21.5" width="5" height="5" rx="1.25"/>
  </g>
  <rect x="5" y="5" width="6" height="6" rx="1.5" fill="#56b4e9"/>
  <rect x="13" y="5" width="6" height="6" rx="1.5" fill="#56b4e9"/>
  <rect x="21" y="5" width="6" height="6" rx="1.5" fill="#e69f00"/>
</svg>
