# PROD edge: serves the built SPA and proxies /api → Granian.

limit_req_zone $binary_remote_addr zone=api_read:10m rate=20r/s;
# Writes get a much tighter bucket; reads map to "" which nginx does not limit.
map $request_method $api_write_key { default $binary_remote_addr; GET ""; HEAD ""; OPTIONS ""; }
limit_req_zone $api_write_key zone=api_write:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 8088;
    server_tokens off;
    root /usr/share/nginx/html;

    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;
    limit_conn per_ip 30;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Security headers. Only declared at server level: an add_header inside a
    # location would silently drop all of these for that location.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Add once TLS terminates in front of this (Railway does):
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # setup audits carry pasted memory files and skills; everything else stays small
    location /api/setup-audits {
        client_max_body_size 512k;
        limit_req zone=api_read burst=40 nodelay;
        limit_req zone=api_write burst=10 nodelay;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_read burst=40 nodelay;
        limit_req zone=api_write burst=10 nodelay;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Hashed build output: cache forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles.
    location ~ /\. { deny all; }
}
