# DEV edge: :8088 → Vite (HMR over websocket) and /api → Granian.
# Same rate limits as prod so you feel them while building. No CSP here:
# Vite injects inline scripts for React Refresh.

limit_req_zone $binary_remote_addr zone=api_read:10m rate=20r/s;
map $request_method $api_write_key { default $binary_remote_addr; GET ""; HEAD ""; OPTIONS ""; }
limit_req_zone $api_write_key zone=api_write:10m rate=30r/m;
limit_req_status 429;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 8088;
    server_tokens off;
    client_max_body_size 32k;

    # Docker's embedded DNS; re-resolve so container restarts don't 502 forever.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $web_upstream http://web:5173;

    location /api/setup-audits {
        client_max_body_size 512k;
        limit_req zone=api_read burst=40 nodelay;
        limit_req zone=api_write burst=10 nodelay;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_read burst=40 nodelay;
        limit_req zone=api_write burst=10 nodelay;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
