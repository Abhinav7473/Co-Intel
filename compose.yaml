# AI Workflow Habits
#
#   docker compose up --watch          → dev on http://localhost:8088
#                                        Vite HMR + Granian reload, files synced by watch
#   docker compose --profile prod up --build db api proxy
#                                      → production images on :8088
#                                        (nginx serves the built frontend, proxies /api)
#
# Dev images use pull_policy: build, so every `up` rebuilds them from cache.
# Watch only syncs changes made *after* start; without this, edits made while
# the stack was down would be missing until the next manual build.
#
# No setup step: every variable has a local default. A .env file, if present,
# overrides them (compose reads it automatically).

name: workflow-habits

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-habits}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habits-local-only}
  POSTGRES_DB: ${POSTGRES_DB:-habits}

x-api: &api
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://localhost:8000/api/health').status != 200)"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s
  restart: unless-stopped

services:
  db:
    image: postgres:18-alpine
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Not published to the host. Shell in with: docker compose exec db psql -U habits

  # ------------------------------------------------------------- dev (default)
  api-dev:
    <<: *api
    pull_policy: build
    build:
      context: ./backend
      target: dev
    environment:
      <<: *db-env
      ENVIRONMENT: dev
    networks:
      default:
        aliases: [api]
    volumes:
      # two-way, so autogenerated migrations land in the repo
      - ./backend/migrations:/app/migrations
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/requirements-dev.txt

  web-dev:
    pull_policy: build
    build:
      context: ./frontend
      target: dev
    networks:
      default:
        aliases: [web]
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync+restart
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./frontend/package.json
    restart: unless-stopped

  proxy-dev:
    image: nginx:stable-alpine
    ports:
      - "8088:8088"
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-dev:
        condition: service_healthy
      web-dev:
        condition: service_started
    restart: unless-stopped

  # --------------------------------------------------------------------- prod
  api:
    <<: *api
    profiles: [prod]
    build:
      context: ./backend
      target: prod
    environment:
      <<: *db-env
      ENVIRONMENT: prod

  proxy:
    profiles: [prod]
    build:
      context: ./frontend
      target: prod
      additional_contexts:
        nginx: ./infra/nginx
    ports:
      - "8088:8088"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
